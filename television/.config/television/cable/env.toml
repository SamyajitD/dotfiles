[metadata]
name = "env"
description = "A channel to select from environment variables"

[source]
command = "printenv"
output = "{split:=:1..}"

[preview]
command = "echo '{split:=:1..}'"

[ui]
layout = "portrait"

[keybindings]
shortcut = "f3"
enter = "actions:edit_value"
ctrl-n = "actions:name"

[ui.preview_panel]
size = 20
header = "{split:=:0}"

[actions.name]
description = "Output the variable name instead of the value"
command = "echo '{split:=:0}'"
mode = "execute"

[actions.edit_value]
description = "Prompt for a new value and copy an export command"
command = '''
name='{split:=:0}';
current='{split:=:1..}';
read -erp "New value for ${name} [${current}]: " new;
[ -z "$new" ] && new="$current";
cmd=$(printf 'export %s=%q' "$name" "$new");
printf '%s\n' "$cmd";
printf '%s' "$cmd" | wl-copy
'''
shell = "bash"
mode = "execute"
