# --- PowerKit overrides that should always win (even after Omarchy theme changes)
TMUX_DIR="${XDG_CONFIG_HOME:-$HOME/.config}/tmux"
LOCAL_OVR="$TMUX_DIR/tmux.local.conf"
mkdir -p "$TMUX_DIR"

cat >"$LOCAL_OVR" <<'EOF'
# User overrides (sourced after omarchy-current-theme.conf)

# Keep the same top bar design, but trim top-right:
# Only show: Root (cwd basename) + Date/Time
set -g @powerkit_plugins "external(\"󰉋\"|\"Root: #{b:pane_current_path}\"|\"info-base\"|\"info-base-lighter\"|\"0\"),datetime"

# Optional: format
set -g @powerkit_plugin_datetime_format "%Y-%m-%d %H:%M"
EOF

