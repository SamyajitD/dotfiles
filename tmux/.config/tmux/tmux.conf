##### Reload
unbind r
bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux.conf reloaded"

##### Terminal / Truecolor
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

##### Prefix
unbind C-b
set -g prefix C-s
bind C-s send-prefix

##### Basics
set -g mouse on
setw -g mode-keys vi
set -g status-position top
set -g escape-time 0
set -g history-limit 100000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g set-clipboard on

##### Keep working dir when creating panes/windows
bind c  new-window      -c "#{pane_current_path}"
bind %  split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"

##### Pane navigation (prefix + hjkl)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

##### -------------------------------------------------------------------
##### Omarchy theme sync (keeps the NICE top bar design)
##### -------------------------------------------------------------------
# omarchy-current-theme.conf is a symlink to the active theme profile.
# Omarchy-tmux uses persistent per-theme profiles so your changes won’t get overwritten. :contentReference[oaicite:2]{index=2}
if-shell -b '[ -f "$HOME/.config/tmux/omarchy-current-theme.conf" ]' \
  'source-file "$HOME/.config/tmux/omarchy-current-theme.conf"' \
  ''

##### -------------------------------------------------------------------
##### Your overrides (change CONTENT, not DESIGN)
##### -------------------------------------------------------------------

# Keep the same layout the themes usually use: session left, windows center, plugins right
# set -g @powerkit_status_order "session,windows,plugins"

# Reduce churn a bit (helps CPU + “feel”); design remains unchanged
set -g @powerkit_status_interval "5"

# TOP-RIGHT: only Root + Date/Time
# PowerKit external() format: external("icon"|"content"|"accent"|"accent_icon"|"ttl") :contentReference[oaicite:3]{index=3}
# set -g @powerkit_plugins 'external("󰉋"|"Root: #{b:pane_current_path}"|"info-base"|"info-base-lighter"|"0"),datetime'

# Date/time formatting (PowerKit supports presets or a custom strftime format) :contentReference[oaicite:4]{index=4}
set -g @powerkit_plugin_datetime_format "%Y-%m-%d %H:%M"

##### Session management
set -g @sessionx-bind 'o'
set -g @sessionx-window-height '85%'
set -g @sessionx-window-width '75%'
set -g @sessionx-zoxide-mode 'on'

##### Persistence (keep, but don’t slow startup)
set -g @resurrect-strategy-nvim 'session'
set -g @resurrect-capture-pane-contents 'off'

# Continuum auto-restore is what makes startup feel slow because it rebuilds sessions on server start. :contentReference[oaicite:5]{index=5}
set -g @continuum-save-interval '15'
set -g @continuum-restore 'off'

##### Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'fabioluciano/tmux-powerkit'
set -g @plugin 'omerxx/tmux-sessionx'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'christoomey/vim-tmux-navigator'

##### TPM init (background so tmux *feels* faster)
# Works with either ~/.config/tmux/plugins or ~/.tmux/plugins depending on where TPM is installed.
if-shell -b '[ -f "$HOME/.config/tmux/plugins/tpm/tpm" ]' \
  'run-shell -b "$HOME/.config/tmux/plugins/tpm/tpm"' \
  'run-shell -b "$HOME/.tmux/plugins/tpm/tpm"'

